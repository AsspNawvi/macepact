name: Build Plugin
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Organize files
        run: |
          mkdir -p project/src/main/java/com/customswords/listeners
          mkdir -p project/src/main/java/com/customswords/managers
          mkdir -p project/src/main/java/com/customswords/commands
          mkdir -p project/src/main/resources
          SRC=project/src/main/java/com/customswords
          RES=project/src/main/resources
          cp pom.xml project/
          cp plugin.yml $RES/
          cp CustomSwords.java $SRC/
          cp SwordType.java $SRC/
          cp SwordManager.java $SRC/managers/
          cp SwordHoldListener.java $SRC/listeners/
          cp SwordHitListener.java $SRC/listeners/
          cp SwordAbilityListener.java $SRC/listeners/
          cp SwordKillListener.java $SRC/listeners/
          cp GodSwordGUIListener.java $SRC/listeners/
          cp GodSwordCraftListener.java $SRC/listeners/
          cp GiveSwordCommand.java $SRC/commands/
          cp SwordListCommand.java $SRC/commands/
      - name: Build
        working-directory: project
        run: mvn package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: CustomSwords
          path: project/target/CustomSwords-1.0.0.jar
