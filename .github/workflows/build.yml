name: Build Plugin
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Debug
        run: find . -not -path './.git/*' | sort
      - name: Organize files
        run: |
          mkdir -p project/src/main/java/com/customswords/listeners
          mkdir -p project/src/main/java/com/customswords/managers
          mkdir -p project/src/main/java/com/customswords/commands
          mkdir -p project/src/main/resources
          SRC=project/src/main/java/com/customswords
          RES=project/src/main/resources
          F=.github/workflows
          cp $F/pom.xml project/
          cp $F/plugin.yml $RES/
          cp $F/CustomSwords.java $SRC/
          cp $F/SwordType.java $SRC/
          cp $F/SwordManager.java $SRC/managers/
          cp $F/SwordHoldListener.java $SRC/listeners/
          cp $F/SwordHitListener.java $SRC/listeners/
          cp $F/SwordAbilityListener.java $SRC/listeners/
          cp $F/SwordKillListener.java $SRC/listeners/
          cp $F/GodSwordGUIListener.java $SRC/listeners/
          cp $F/GodSwordCraftListener.java $SRC/listeners/
          cp $F/GiveSwordCommand.java $SRC/commands/
          cp $F/SwordListCommand.java $SRC/commands/
      - name: Build
        working-directory: project
        run: mvn package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: CustomSwords
          path: project/target/CustomSwords-1.0.0.jar
